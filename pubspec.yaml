name: expense_tracker
description: A smart expense tracking app with charts and analytics.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  sqflite: ^2.3.0          # Local database
  path: ^1.8.3             # Path handling
  intl: ^0.18.1            # Date formatting
  fl_chart: ^0.65.0        # Beautiful charts
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  sqflite_common_ffi: ^2.3.0

flutter:
  uses-material-design: true